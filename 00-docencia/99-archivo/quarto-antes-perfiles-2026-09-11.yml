project:
  type: book
  output-dir: _book
  resources:
    - "01-estudiantes/03-lecturas/*.pdf"
    - "00-docencia/90-antecedentes/vevox/*.xlsx"
    - "00-docencia/00-bitacora/*.json"
    - "00-docencia/99-archivo/*.zip"
    - "00-docencia/99-archivo/*.qmd"
    - "00-docencia/99-archivo/reporte_conversacion_agentes.md"

book:
