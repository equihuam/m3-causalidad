  subtitle: "Curso intensivo de nueve días · Edición integral de trabajo"
  language: es
  search: true
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - part: 00-docencia/README.md
      chapters:
        # Diseño pedagógico y didáctico
