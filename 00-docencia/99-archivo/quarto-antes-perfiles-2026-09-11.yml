        - 00-docencia/01-diseno-curso/arquitectura-actividades-rstudio.qmd
        - 00-docencia/01-diseno-curso/competencia-reproducibilidad-analitica.qmd
        - 00-docencia/01-diseno-curso/evaluacion/rubrica-proyecto-y-reflexion.qmd
        # Decisiones del responsable del curso
        - 00-docencia/00-bitacora/bitacora-maestra.qmd
        - 00-docencia/01-diseno-curso/decisiones-y-evolucion-del-curso.qmd
        # Preparación de instructores
        - 00-docencia/02-guias-instructores/ensenar-bitacora-analitica.qmd
